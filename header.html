<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Vikash Srivastava" />
    <title>VS</title>
    <link rel="stylesheet" href="style1.css" />
  </head>
  <style>
    .dark {
      background-color: #111;
      color: white;
    }
    input {
      border: 1px solid skyblue;
    }
    input:focus {
      border: none;
      outline: 2px solid skyblue;
      /* border: 2px solid skyblue; */
    }
    button {
      padding: 0.15rem 0.5rem;
    }
    a {
      color: gray;
      padding: 2px 5px;
      border-radius: 5px;
    }
    a:hover {
      background: lightgray;
      color: black;
    }
  </style>
  <body>
    <header class="fcx">
      <div>Logo</div>
      <div class="fcx" style="border-radius: 20px; height: 2rem">
        <input
          type="text"
          placeholder="Search"
          style="border-radius: 20px; height: 1.8rem; padding: 3px 10px"
        />

        <button
          id="btn1"
          style="
            border: 1px solid gray;
            width: 3rem;
            border-radius: 20px;
            height: 1.5rem;

            margin-left: -3.65rem;
            box-shadow: 0 3px 5px rgba(0, 0, 0, 0.3);
          "
        >
          Click
        </button>
      </div>

      <div class="fcx" style="padding: 0">
        <a href="">Link1</a>
        <a href="">Link2</a>
      </div>
    </header>
  </body>
</html>
